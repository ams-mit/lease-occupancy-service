services:
  lease_db:
    image: mysql:8.0
    ports:
      - "3308:3306"
    environment:
      MYSQL_DATABASE: ${DB_NAME:-lease_db}
      MYSQL_USER: ${DB_USERNAME:-lease_service}
      MYSQL_PASSWORD: ${DB_PASSWORD:-lease_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-local_root_password}
    volumes:
      - lease_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -u $${MYSQL_USER} -p$${MYSQL_PASSWORD} -Nse 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 90s

  lease-occupancy-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lease-occupancy-service
    ports:
      - "8084:8084"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://lease_db:3306/${DB_NAME:-lease_db}
      DB_USERNAME: ${DB_USERNAME:-lease_service}
      DB_PASSWORD: ${DB_PASSWORD:-lease_password}
      GATEWAY_URL: ${GATEWAY_URL:-http://host.docker.internal:8080}
      GATEWAY_JWT_PUBLIC_KEY: ${GATEWAY_JWT_PUBLIC_KEY:-}
      SERVICE_JWT_PRIVATE_KEY: ${SERVICE_JWT_PRIVATE_KEY:-}
      SERVICE_NAME: lease-occupancy-service
      SERVICE_JWT_EXPIRES_IN_SECONDS: ${SERVICE_JWT_EXPIRES_IN_SECONDS:-300}
    depends_on:
      lease_db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8084/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  lease_db_data:
