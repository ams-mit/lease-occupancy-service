services:
  lease_db:
    image: postgres:16-alpine
    ports:
      - "3308:5432"
    environment:
      POSTGRES_DB: ${DB_NAME:-lease_db}
      POSTGRES_USER: ${DB_USERNAME:-lease_service}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-lease_password}
    volumes:
      - lease_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  lease-occupancy-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lease-occupancy-service
    ports:
      - "8084:8084"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://lease_db:5432/${DB_NAME:-lease_db}
      DB_USERNAME: ${DB_USERNAME:-lease_service}
      DB_PASSWORD: ${DB_PASSWORD:-lease_password}
    depends_on:
      lease_db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8084/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  lease_db_data:
