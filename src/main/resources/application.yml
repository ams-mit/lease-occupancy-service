server:
  port: 8084

spring:
  application:
    name: lease-occupancy-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:lease_db}
    username: ${DB_USERNAME:lease_service}
    password: ${DB_PASSWORD:lease_service}
    driver-class-name: org.postgresql.Driver
  jpa:
    # Schema is owned by Flyway migrations, not Hibernate auto-DDL.
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
  info:
    env:
      enabled: true

info:
  service:
    name: lease-occupancy-service
    description: Owns lease and occupancy records for the Apartment Management System

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
  show-actuator: false
