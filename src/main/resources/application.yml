server:
  port: 8084

spring:
  application:
    name: lease-occupancy-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:lease_db}
    username: ${DB_USERNAME:lease_service}
    password: ${DB_PASSWORD:lease_service}
    driver-class-name: org.postgresql.Driver
  jpa:
    # Schema is owned by Flyway migrations, not Hibernate auto-DDL.
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
  info:
    env:
      enabled: true

info:
  service:
    name: lease-occupancy-service
    description: Owns lease and occupancy records for the Apartment Management System

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
  show-actuator: false

app:
  jwt:
    # Per Project_A_JWT_Authentication_and_Security_Standard.md / AGENTS.md §8.
    service-name: ${SERVICE_NAME:lease-occupancy-service}
    # PEM-encoded (X.509 SubjectPublicKeyInfo). Verifies every incoming Gateway-signed request.
    gateway-public-key: ${GATEWAY_JWT_PUBLIC_KEY:}
    # PEM-encoded (PKCS8). Signs the Service JWT this service mints for outbound calls.
    service-private-key: ${SERVICE_JWT_PRIVATE_KEY:}
    service-jwt-ttl-seconds: ${SERVICE_JWT_EXPIRES_IN_SECONDS:300}
  services:
    # All outbound inter-service calls route through the Gateway (never directly to a
    # sibling service) — Service A -> Gateway -> Service B, per the JWT standard.
    gateway-base-url: ${GATEWAY_URL:http://localhost:8080}
    # Bounded inter-service call timeouts per API-STANDARD-v1 §29 — never wait indefinitely on a dependency.
    connect-timeout-ms: 2000
    read-timeout-ms: 5000
