# Test-only profile: an in-memory H2 database stands in for lease_db so the context
# can load in CI/local test runs without a running PostgreSQL instance.
spring:
  datasource:
    url: jdbc:h2:mem:lease_db_test;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  flyway:
    # Flyway migrations target real PostgreSQL syntax; tests use Hibernate
    # ddl-auto against H2 instead. A Testcontainers-based Postgres suite is the
    # natural follow-up for migration-accurate integration tests.
    enabled: false

# NOTE: this file replaces application.yml entirely on the test classpath (Spring Boot
# only loads one "application.yml", and test-classes precedes classes on the test
# classpath) — so service client config needed by @SpringBootTest also has to live here.
app:
  jwt:
    service-name: lease-occupancy-service
    service-jwt-ttl-seconds: 300
